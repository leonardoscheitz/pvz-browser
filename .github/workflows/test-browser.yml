name: Testar o GOTY no navegador
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.js'
      - 'scripts/**'
      - 'vendor/**'
      - 'modern/pvz-goty.zip'
      - 'tests/**'
      - '.github/workflows/test-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jogo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, os: ubuntu-latest }
          - { browser: firefox, os: ubuntu-latest }
          - { browser: webkit, os: macos-latest }
          - { browser: msedge, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PVZ_BROWSER: ${{ matrix.browser }}
      PVZ_REQUIRE_ADVANCED: ${{ matrix.browser == 'chromium' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python -m pip install playwright==1.62.0
      - if: matrix.browser != 'msedge'
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'firefox'
        run: xvfb-run -a python tests/test_browser.py
      - if: matrix.browser != 'firefox'
        run: python tests/test_browser.py
      - name: Testar também o Safari instalado no macOS
        if: matrix.browser == 'webkit'
        run: |
          python -m pip install 'selenium>=4,<5'
          sudo safaridriver --enable
          python tests/safari_smoke.py
  safari-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - run: python -m pip install 'selenium>=4,<5'
      - name: Abrir o Safari de um iPhone simulado
        run: |
          device=$(xcrun simctl list devices available --json | python -c "import json,sys; print(next(d['udid'] for runtime,ds in json.load(sys.stdin)['devices'].items() if '.iOS-' in runtime for d in ds if d['name'].startswith('iPhone')))")
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl bootstatus "$device" -b
          open -a Simulator
          sudo safaridriver --enable
          # The simulator may report booted before MobileSafari is ready for WebDriver.
          # Retry only infrastructure failures before a browser session exists.
          for attempt in 1 2; do
            xcrun simctl launch "$device" com.apple.mobilesafari
            sleep 10
            set +e
            PVZ_IOS_SIMULATOR="$device" python tests/safari_smoke.py 2>&1 | tee "$RUNNER_TEMP/safari-ios-$attempt.log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 2 ] || ! grep -Eq 'SessionNotCreatedException:.*(timed out|Could not create a session)|Can not connect to the Service /usr/bin/safaridriver' "$RUNNER_TEMP/safari-ios-$attempt.log"; then
              exit "$result"
            fi
            echo "Safari WebDriver indisponível antes dos testes; reiniciando somente o navegador."
            xcrun simctl terminate "$device" com.apple.mobilesafari || true
            sleep 5
          done
