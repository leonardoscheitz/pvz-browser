name: Publicar jogo no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Preparar o jogo nativo
        run: |
          python3 scripts/build.py
          printf '%s\n' "$GITHUB_SHA" > dist/revision.txt
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: context.runId});
              artifact = data.artifacts.find(item => item.name === 'github-pages' && !item.expired);
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!artifact) throw new Error('O pacote github-pages não ficou disponível.');
            core.info(`Publicando pacote ${artifact.id}`);
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: oidc
            });
            core.setOutput('page_url', deployment.page_url);
            const deploymentId = deployment.id || deployment.status_url.split('/').pop();
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner, repo, deploymentId
              });
              if (data.status === 'succeed') {
                core.info(`Publicado: ${deployment.page_url}`);
                return;
              }
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(data.status)) {
                throw new Error(`Falha na publicação: ${data.status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('A publicação não terminou em cinco minutos.');
      - name: Conferir a revisão e a página que o visitante recebe
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl -fsSL --max-time 10 "${PAGE_URL%/}/revision.txt?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/pvz-revision" &&
               cmp -s dist/revision.txt "$RUNNER_TEMP/pvz-revision" &&
               curl -fsSL --max-time 10 "${PAGE_URL%/}/?rev=$GITHUB_SHA" -o "$RUNNER_TEMP/pvz-index" &&
               cmp -s dist/index.html "$RUNNER_TEMP/pvz-index"; then
              echo "Revisão $GITHUB_SHA disponível em $PAGE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "O endereço público não entregou a revisão e a página deste build." >&2
          exit 1
