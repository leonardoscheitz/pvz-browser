<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0e">
  <meta name="description" content="Jogue Plants vs. Zombies GOTY diretamente no navegador.">
  <title>Plants vs. Zombies — Game of the Year</title>
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="{{BACKGROUND}}">
  <style>
    * { box-sizing: border-box }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100e0e; color: white; }
    body { font: 16px/1.35 system-ui, sans-serif; }
    [hidden] { display: none !important; }
    #canvas-container { position: fixed; inset: 0; display: grid; place-items: center; background: #100e0e; }
    #frame { position: relative; width: min(100vw, 133.333333vh); width: min(100vw, 133.333333dvh); aspect-ratio: 4/3; container-type: inline-size; }
    #canvas, #splash { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    #canvas { display: block; outline: 0; touch-action: none; }
    #splash { background: url('{{BACKGROUND}}') center / 100% 100% no-repeat; }
    .logo { position: absolute; left: 6.25%; top: 2.5%; width: 87.5%; height: 19.333%;
      background: url('{{LOGO}}') center / 100% 100% no-repeat;
      mask: url('{{ALPHA}}') center / 100% 100% no-repeat; mask-mode: luminance; }
    .track { position: absolute; left: 29.875%; top: 85.33%; width: 40.125%; height: 12%;
      background: url('{{DIRT}}') left bottom / 100% 73.61% no-repeat; text-align: center; }
    #grass { width: 97.82%; height: 45.83%; background: url('{{GRASS}}') left top / 100% 100% no-repeat;
      clip-path: inset(0 calc(100% - var(--fill, 0%)) 0 0); }
    #progress-text { position: absolute; left: 0; right: 0; top: 40%; color: #ffdc76;
      font: bold clamp(10px, 2.35cqw, 28px)/1 Georgia, serif; text-shadow: 1px 2px 2px #220c07; }
    #panel { position: absolute; inset: 0; display: grid; place-content: center; padding: 1rem; background: #100e0e99; }
    .dialog { text-align: center; max-width: 27rem; padding: 1.25rem 1.5rem; border-radius: .4rem; background: #24211c; }
    .dialog p { margin: 0 0 1rem; }
    button { cursor: pointer; font: inherit; color: #fff7cb; background: #395720; border: 1px solid #91a76b; border-radius: .3rem; padding: .5rem 1.15rem; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    #notice { position: absolute; top: .6rem; left: 50%; transform: translateX(-50%); width: max-content;
      max-width: 94%; padding: .45rem .7rem; border-radius: .3rem; background: #262114f2; font-size: .85rem; }
    #notice button { margin-left: .5rem; padding: .1rem .45rem; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <main id="canvas-container" aria-label="Plants vs. Zombies">
    <div id="frame">
      <canvas id="canvas" width="800" height="600" tabindex="0" aria-label="Plants vs. Zombies GOTY">Seu navegador precisa oferecer suporte a canvas.</canvas>
      <div id="splash">
        <span class="logo" aria-hidden="true"></span>
        <div class="track" role="progressbar" aria-label="Carregando o jogo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="grass"></div><span id="progress-text">Carregando…</span>
        </div>
      </div>
      <div id="panel" hidden>
        <div class="dialog"><p id="message" role="status"></p><button id="retry" type="button">Tentar novamente</button></div>
      </div>
      <div id="notice" role="status" hidden><span></span><button type="button" aria-label="Fechar aviso">OK</button></div>
      <noscript><div id="panel"><div class="dialog">Ative o JavaScript para jogar.</div></div></noscript>
    </div>
  </main>
  <script id="config" type="application/json">{{CONFIG}}</script>
  <script type="module" src="{{SCRIPT}}"></script>
</body>
</html>
