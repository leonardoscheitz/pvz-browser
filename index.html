<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0e">
  <meta name="description" content="Jogue Plants vs. Zombies GOTY diretamente no navegador.">
  <title>Plants vs. Zombies — Game of the Year</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" as="image" href="{{BACKGROUND}}">
  <link rel="stylesheet" href="ui-kit.css">
  <style>
    * { box-sizing: border-box }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100e0e; color: white; }
    body { font: 16px/1.35 system-ui, sans-serif; }
    [hidden] { display: none !important; }
    #canvas-container { position: fixed; inset: 0; display: grid; place-items: center; background: #100e0e; }
    #frame { position: relative; width: min(100vw, 133.333333vh); width: min(100vw, 133.333333dvh); aspect-ratio: 4/3; container-type: inline-size; }
    #canvas, #splash { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    #canvas { display: block; outline: 0; touch-action: none; }
    #pvz-soft-keyboard { position: absolute; top: 0; left: 0; width: 1px; height: 1px;
      padding: 0; border: 0; opacity: 0; resize: none; pointer-events: none; font-size: 16px; }
    #splash { background: url('{{BACKGROUND}}') center / 100% 100% no-repeat; }
    .logo { position: absolute; left: 6.25%; top: 2.5%; width: 87.5%; height: 19.333%;
      background: url('{{LOGO}}') center / 100% 100% no-repeat;
      mask: url('{{ALPHA}}') center / 100% 100% no-repeat; mask-mode: luminance; }
    .track { position: absolute; left: 29.875%; top: 85.33%; width: 40.125%; height: 12%;
      background: url('{{DIRT}}') left bottom / 100% 73.61% no-repeat; text-align: center; }
    #grass { width: 97.82%; height: 45.83%; background: url('{{GRASS}}') left top / 100% 100% no-repeat;
      clip-path: inset(0 calc(100% - var(--fill, 0%)) 0 0); }
    #progress-text { position: absolute; left: 0; right: 0; top: 40%; color: #ffdc76;
      font: bold clamp(10px, 2.35cqw, 28px)/1 Georgia, serif; text-shadow: 1px 2px 2px #220c07; }
    #panel { position: absolute; inset: 0; display: grid; place-content: center; padding: 1rem; background: #100e0e99; }
    .dialog { text-align: center; max-width: 27rem; padding: 1.25rem 1.5rem; border-radius: .4rem; background: #24211c; }
    .dialog p { margin: 0 0 1rem; }
    button { cursor: pointer; font: inherit; color: #fff7cb; background: #395720; border: 1px solid #91a76b; border-radius: .3rem; padding: .5rem 1.15rem; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    #notice { position: absolute; top: .6rem; left: 50%; transform: translateX(-50%); width: max-content;
      max-width: 94%; padding: .45rem .7rem; border-radius: .3rem; background: #262114f2; font-size: .85rem; }
    #notice button { margin-left: .5rem; padding: .1rem .45rem; }
    .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    #garden-trigger, #garden-menu button { font-family: var(--pvz-display); font-weight: 900; }
    #garden-trigger { position: absolute; bottom: 1%; left: 1%; background: url('{{STONE_BUTTON}}') center / 100% 100%;
      padding: .48em .85em .58em .45em; border: 0; color: #def798; text-shadow: 1px 2px 2px #181321;
      display: flex; align-items: center; gap: .15em; font-size: clamp(12px,1.85cqw,19px); }
    #tools-link { position: absolute; right: 1%; bottom: 1%; z-index: 1; padding: .5em .7em;
      color: #def798; background: var(--pvz-stone) center / 100% 100% no-repeat; border: 0; border-radius: 0;
      font: bold clamp(12px,1.8cqw,18px)/1.3 var(--pvz-display); text-decoration: none; touch-action: manipulation; }
    #sandbox-indicator { position: absolute; top: max(6px, env(safe-area-inset-top)); right: 8px; z-index: 1; padding: 4px 9px; background: #433421e8; color: #ffe7a1; border: 1px solid #b89c5e; border-radius: 4px; font: bold 12px system-ui,sans-serif; pointer-events: none; }
    #tools-link:focus-visible { outline: 2px solid white; }
    @media (any-pointer: coarse) { #tools-link { min-height: 44px; display: grid; place-items: center; } }
    #garden-trigger img { width: 1.4em; height: 1.4em; }
    #garden-menu { position: fixed; inset: 0 auto auto 0; margin: 0; border: 0; padding: 0;
      width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none;
      background: transparent; color: #fff1cb; overflow: hidden;
      font: bold clamp(14px, 2.6vmin, 18px)/1.2 var(--pvz-display); }
    #garden-menu[open] { display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; }
    .garden-card { position: relative; width: min(420px, 95vw); height: clamp(465px, 119vw, 496px);
      max-width: 96%; max-height: 96%; }
    #garden-menu::backdrop { background: #08070bb8; }
    .garden-card::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: url('{{GRAVE}}') center / 100% 100%; mask: url('{{GRAVE_MASK}}') center / 100% 100%; mask-mode: luminance; }
    .garden-controls { position: absolute; inset: 24% 17% 24%; overflow-y: auto; scrollbar-width: thin;
      display: flex; flex-direction: column; gap: .35em; padding: 2px 3px 6px; }
    .garden-controls > * { flex-shrink: 0; }
    .garden-controls h2 { color: #ffe89a; text-align: center; font-size: 1.35em; margin: 0 0 .1em; text-shadow: 1px 2px #201822; }
    .garden-row { margin: 0; display: flex; gap: .35em; align-items: center; justify-content: space-between; min-height: 1.7em; }
    .garden-row label { margin-right: auto; }
    .garden-controls input[type=number], .garden-controls select { font: inherit; color: #fff2bd; background: #292735;
      border: 1px solid #948c96; border-radius: 3px; padding: .15em; }
    .garden-controls input[type=number] { width: 5.35em; }
    .garden-controls input[type=checkbox] { accent-color: #a4cd65; width: 1.35em; height: 1.35em; }
    #garden-menu button { font-size: inherit; }
    #garden-menu .garden-controls .pvz-stone { min-height: 34px; padding: .4em .5em .5em; }
    .garden-controls button { padding: .35em .5em; color: #d5eca6; }
    .garden-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .4em; }
    #garden-menu .garden-actions button { font-size: .87em; padding: .5em .55em; white-space: nowrap; }
    #garden-menu output { position: absolute; top: 76%; left: 8%; right: 8%; font: bold .8em/1.2 system-ui, sans-serif;
      text-align: center; color: #fff2cd; text-shadow: 1px 1px 2px #181421; }
    #garden-back { position: absolute; left: 12%; right: 12%; top: 81%; height: 12%; background: url('{{STONE_BUTTON}}') center / 100% 100%;
      border: 0; color: #c9ef83; text-shadow: 1px 2px #24202b; }
    #garden-back:focus-visible { outline: 2px solid #ffdf91; outline-offset: -5px; }
    #garden-trigger { z-index: 1; touch-action: manipulation; }
    #garden-trigger img { pointer-events: none; }
    #panel, #notice { z-index: 2; }
    @media (hover: hover) and (pointer: fine) {
      #garden-menu button:hover, #garden-trigger:hover { filter: brightness(1.2); }
    }
    @media (any-pointer: coarse) {
      #garden-trigger { min-height: 44px; min-width: 96px; left: max(6px, env(safe-area-inset-left));
        bottom: max(5px, env(safe-area-inset-bottom)); font-size: 14px; }
      #garden-menu .garden-controls input, #garden-menu select { font-size: 16px; }
      #garden-menu button { touch-action: manipulation; }
      .garden-controls { overscroll-behavior: contain; }
      .garden-controls button, .garden-controls select, .garden-row { min-height: 34px; }
      #garden-back { min-height: 38px; }
    }
    @media (orientation: landscape) and (max-height: 540px) {
      .garden-card { width: min(94vw, 720px); height: 96%; }
      .garden-controls { inset: 22% 13% 24%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start; align-items: center; gap: .3em .8em; }
      .garden-controls h2, .garden-actions { grid-column: 1 / -1; }
      .garden-row { gap: .2em; }
      .garden-controls input[type=number] { width: 4.75em; }
      .garden-actions { grid-template-columns: 1fr 1fr; }
    }

    /* Size the controls against the actual visual viewport, including the
       space left when a mobile keyboard is open. */
    #garden-menu { container-type: size; }
    .garden-card { width: min(420px, 95%); max-height: 96%; }
    .garden-controls { overflow-x: hidden; overscroll-behavior: contain; }
    .garden-row > input[type=number] { min-width: 0; flex: 0 1 5.35em; }
    .garden-row > button { flex-shrink: 0; }
    .garden-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #garden-menu .garden-actions button { white-space: normal; overflow-wrap: anywhere; }
    @container (max-width: 360px) {
      .garden-controls { inset-inline: 12%; }
      .garden-row { gap: .2em; }
    }
    @container (min-width: 480px) and (max-height: 540px) {
      .garden-card { width: min(94%, 720px); height: 96%; }
      .garden-controls { inset: 22% 13% 24%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        align-content: start; align-items: center; gap: .3em .8em; }
      .garden-controls h2, .garden-actions { grid-column: 1 / -1; }
      .garden-row { gap: .2em; }
      .garden-controls input[type=number] { width: 4.75em; flex-basis: 4.75em; }
    }
    @container (max-height: 250px) {
      .garden-card { height: 96%; }
      .garden-controls { inset: 10% 12% 30%; }
      #garden-menu output { top: 71%; }
      #garden-back { top: auto; bottom: 4%; height: 16%; }
    }

    /* Only the selector's Sandbox entry is visible over the main menu.
       Exit is a normal flow item inside the modal; no reserved viewport area. */
    body.sandbox-session #sandbox-level-trigger { min-height: 38px; }
    #sandbox-level-menu #tools-link {
      position: static; inset: auto; margin: 0; min-height: 40px; flex-shrink: 0;
      font-size: 16px; padding: .45em .75em .55em;
    }
    @media (any-pointer: coarse) {
      body.sandbox-session #sandbox-level-trigger,
      #sandbox-level-menu #tools-link { min-height: 44px; }
    }
  </style>
</head>
<body>
  <main id="canvas-container" aria-label="Plants vs. Zombies">
    <div id="frame">
      <canvas id="canvas" width="800" height="600" tabindex="0" aria-label="Plants vs. Zombies GOTY">Seu navegador precisa oferecer suporte a canvas.</canvas>
      <textarea id="pvz-soft-keyboard" tabindex="-1" aria-label="Nome do jogador" rows="1"
        autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></textarea>
      <div id="splash">
        <span class="logo" aria-hidden="true"></span>
        <div class="track" role="progressbar" aria-label="Carregando o jogo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="grass"></div><span id="progress-text">Carregando…</span>
        </div>
      </div>
      <button class="pvz-stone" id="sandbox-level-trigger" type="button" aria-haspopup="dialog" hidden>Escolher fase</button>
      <span id="sandbox-indicator" hidden>Sandbox · temporário</span>
      <a class="pvz-stone" id="tools-link" href="tools.html" hidden>Ferramentas</a>
      <button class="pvz-stone" id="garden-trigger" type="button" aria-haspopup="dialog" aria-controls="garden-menu" hidden><img src="{{SPADE}}" alt="">Menu Hack</button>
      <div id="panel" hidden>
        <div class="dialog"><p id="message" role="status"></p><button id="retry" type="button">Tentar novamente</button></div>
      </div>
      <div id="notice" role="status" hidden><span></span><button type="button" aria-label="Fechar aviso">OK</button></div>
      <noscript><div id="panel"><div class="dialog">Ative o JavaScript para jogar.</div></div></noscript>
    </div>
      <dialog id="garden-menu" aria-labelledby="garden-title">
        <div class="garden-card">
          <div class="garden-controls">
          <h2 class="pvz-title" id="garden-title">Menu Hack</h2>
          <form class="garden-row"><label for="garden-sun">Sol</label><input id="garden-sun" type="number" min="0" max="9990" required inputmode="numeric"><button class="pvz-stone">Aplicar</button></form>
          <form class="garden-row"><label for="garden-coins">Moedas</label><input id="garden-coins" type="number" min="0" max="999990" step="10" required inputmode="numeric"><button class="pvz-stone">Aplicar</button></form>
          <label class="garden-row">Plantio grátis<input type="checkbox" id="garden-free"></label>
          <label class="garden-row">Velocidade<select id="garden-speed"><option value="0">Lenta</option><option value="1">Normal</option><option value="2">Rápida</option></select></label>
          <div class="garden-actions"><button class="pvz-stone" id="garden-heal">Curar plantas</button><button class="pvz-stone" id="garden-clear">Limpar zumbis</button></div>
          <div class="garden-actions"><button class="pvz-stone" id="garden-relaxed" type="button">Modo livre</button><button class="pvz-stone" id="garden-normal" type="button">Regras normais</button></div>
          <label class="garden-row" id="garden-infinite-row" hidden>Sol infinito<input type="checkbox" id="garden-infinite"></label>
          <label class="garden-row" id="garden-recharge-row" hidden>Recarga instantânea<input type="checkbox" id="garden-recharge"></label>
          <div class="garden-actions" id="garden-chill-row" hidden><button class="pvz-stone" id="garden-chill" type="button">Retardar zumbis</button></div>
          <section id="garden-editor" hidden aria-label="Editor do Sandbox" style="grid-column:1/-1">
            <h2 class="pvz-title">Editor do jardim</h2>
            <label class="garden-row">Coluna <input id="editor-col" type="number" min="1" max="9" value="1" required inputmode="numeric"></label>
            <label class="garden-row">Linha <input id="editor-row" type="number" min="1" max="6" value="3" required inputmode="numeric"></label>
            <label class="garden-row">Planta <select id="editor-seed" style="min-width:0;max-width:65%">
              <option value="0">Ervilhadora</option><option value="1">Girassol</option>
              <option value="3">Noz</option><option value="5">Ervilhadora de gelo</option>
              <option value="7">Repetidora</option><option value="8">Puff-shroom</option>
              <option value="10">Fume-shroom</option><option value="23">Noz alta</option>
            </select></label>
            <div class="garden-actions"><button class="pvz-stone" id="editor-plant" type="button">Invocar</button><button class="pvz-stone" id="editor-remove" type="button">Remover</button></div>
          </section>
        </div>
        <output aria-live="polite"></output>
        <button class="pvz-stone" id="garden-back" autofocus>Voltar ao jogo</button>
        </div>
      </dialog>
      <dialog id="sandbox-level-menu" aria-labelledby="sandbox-level-title">
        <div class="sandbox-stone-card">
          <form>
            <h2 id="sandbox-level-title" class="pvz-title">Sandbox</h2>
            <label for="sandbox-level">Adventure</label>
            <select id="sandbox-level" required></select>
            <output aria-live="polite"></output>
            <button class="pvz-stone" type="submit">Jogar</button>
            <button class="pvz-stone" type="button" data-close>Voltar</button>
          </form>
        </div>
      </dialog>
  </main>
  <script id="config" type="application/json">{{CONFIG}}</script>
  <script type="module" src="{{SCRIPT}}"></script>
</body>
</html>
